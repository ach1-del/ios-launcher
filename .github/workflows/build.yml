name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk aura-tv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aura-tv-apk
          path: aura-tv.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build
          name: Aura TV (latest build)
          files: aura-tv.apk
          make_latest: true
